packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  electron: true
  esbuild: true
  better-sqlite3: true
  prisma: true
  '@prisma/engines': true
  embedded-postgres: true
  '@embedded-postgres/windows-x64': true

# F2/Q3：audit 高危清零（multer DoS / deepmerge-ts 栈耗尽 / mysql2 凭据泄漏 / qs DoS / body-parser 限值绕过）
overrides:
  multer: '>=2.3.0'
  deepmerge-ts: '>=8.0.0'
  mysql2: '>=3.23.1'
  qs: '>=6.16.0'
  body-parser: '>=1.20.6'
