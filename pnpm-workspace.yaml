packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  electron: true
  esbuild: true
  better-sqlite3: true
  prisma: true
  '@prisma/engines': true
  embedded-postgres: true
  '@embedded-postgres/windows-x64': true

# F2/Q3：audit 高危清零（multer DoS / deepmerge-ts 栈耗尽 / mysql2 凭据泄漏 / qs DoS / body-parser 限值绕过）
overrides:
  multer: '>=2.3.0'
  deepmerge-ts: '>=8.0.0'
  mysql2: '>=3.23.1'
  qs: '>=6.16.0'
  body-parser: '>=1.20.6'
  # GHSA-fgmj-fm8m-jvvx（moderate XSS，echarts<6.1.0）；echarts-wordcloud 2.1.0 peer 声明 ^5
  # 但 wordcloud 渲染在 echarts 6 下经 e2e canvas 断言实测兼容（report-ui 用例 A 为金丝雀）
  echarts: '>=6.1.0'
